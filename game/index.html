<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solstice Heat — Solstice Bay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b1020;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #f5f0e6;
  }
  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hud {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  #hud-top-left {
    top: 14px;
    left: 16px;
  }
  #hud-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffd166;
  }
  #hud-district {
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.9;
  }
  #hud-clock {
    font-size: 13px;
    opacity: 0.85;
  }
  #hud-top-right {
    top: 14px;
    right: 16px;
    text-align: right;
  }
  #hud-cash {
    font-size: 20px;
    font-weight: 700;
    color: #8be26e;
  }
  #hud-bank {
    font-size: 12px;
    opacity: 0.85;
  }
  #hud-stars {
    font-size: 20px;
    color: #ffd166;
    letter-spacing: 3px;
    min-height: 24px;
  }
  #hud-rank {
    font-size: 12px;
    opacity: 0.9;
  }
  #hud-bottom-left {
    left: 16px;
    bottom: 16px;
  }
  .bar {
    width: 220px;
    height: 12px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.35);
    margin-top: 5px;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
  }
  #health-fill { background: #e2452c; }
  #armor-fill { background: #3f8fe0; }
  #bust-fill { background: #ffd166; }
  .bar-label {
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 6px;
  }
  #hud-bottom-right {
    right: 16px;
    bottom: 16px;
    text-align: right;
  }
  #minimap {
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(8, 14, 28, 0.8);
  }
  #hud-speed {
    font-size: 18px;
    font-weight: 700;
    margin-top: 6px;
  }
  #hud-ammo {
    font-size: 13px;
    opacity: 0.9;
  }
  #hud-center {
    left: 50%;
    top: 12%;
    transform: translateX(-50%);
    text-align: center;
    width: 70%;
  }
  #mission-title {
    font-size: 24px;
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
  }
  #mission-text {
    font-size: 16px;
    margin-top: 4px;
  }
  #mission-sub {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 2px;
  }
  #hud-prompt {
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);
    font-size: 16px;
    background: rgba(0, 0, 0, 0.55);
    padding: 8px 16px;
    border-radius: 6px;
    display: none;
  }
  #hud-toast {
    left: 50%;
    bottom: 26%;
    transform: translateX(-50%);
    font-size: 15px;
    color: #ffd166;
    display: none;
  }
  #hud-radio {
    left: 16px;
    bottom: 150px;
    font-size: 13px;
    opacity: 0.9;
  }
  #photo-frame {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: none;
  }
  .photo-bar {
    position: absolute;
    left: 0;
    right: 0;
    height: 9vh;
    background: #000;
  }
  #photo-bar-top { top: 0; }
  #photo-bar-bottom { bottom: 0; }
  #photo-label {
    position: absolute;
    right: 18px;
    bottom: 11vh;
    color: #fff;
    font-size: 13px;
    letter-spacing: 2px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(5, 8, 18, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #overlay-box {
    max-width: 560px;
    padding: 28px;
  }
  #overlay-title {
    font-size: 30px;
    color: #ffd166;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  #overlay-text {
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div class="hud" id="hud-top-left">
  <div id="hud-title">SOLSTICE HEAT</div>
  <div id="hud-district">Boardwalk</div>
  <div id="hud-clock">12:00 · Clear</div>
</div>

<div class="hud" id="hud-top-right">
  <div id="hud-stars"></div>
  <div id="hud-cash">$0</div>
  <div id="hud-bank">Bank $0</div>
  <div id="hud-rank">Rank 1 · Runner · 0 XP</div>
</div>

<div class="hud" id="hud-center">
  <div id="mission-title"></div>
  <div id="mission-text"></div>
  <div id="mission-sub"></div>
</div>

<div class="hud" id="hud-bottom-left">
  <div class="bar-label">HEALTH</div>
  <div class="bar"><div class="bar-fill" id="health-fill"></div></div>
  <div class="bar-label">ARMOR</div>
  <div class="bar"><div class="bar-fill" id="armor-fill"></div></div>
  <div class="bar-label">BUST</div>
  <div class="bar"><div class="bar-fill" id="bust-fill"></div></div>
</div>

<div class="hud" id="hud-radio"></div>

<div class="hud" id="hud-bottom-right">
  <canvas id="minimap" width="252" height="190"></canvas>
  <div id="hud-speed"></div>
  <div id="hud-ammo"></div>
</div>

<div class="hud" id="hud-prompt"></div>
<div class="hud" id="hud-toast"></div>

<div id="photo-frame">
  <div class="photo-bar" id="photo-bar-top"></div>
  <div class="photo-bar" id="photo-bar-bottom"></div>
  <div id="photo-label">PHOTO MODE · P TO EXIT</div>
</div>

<div id="overlay">
  <div id="overlay-box">
    <div id="overlay-title">SOLSTICE HEAT</div>
    <div id="overlay-text">Welcome to Solstice Bay.</div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="src/config.js"></script>
<script src="src/rng.js"></script>
<script src="src/audio.js"></script>
<script src="src/city.js"></script>
<script src="src/weather.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/people.js"></script>
<script src="src/player.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/economy.js"></script>
<script src="src/jobs.js"></script>
<script src="src/races.js"></script>
<script src="src/activities.js"></script>
<script src="src/hud.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
